<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Query Form</title>
    <script src="https://cdn.tailwindcs.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f9ff;
        }
        .custom-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto bg-white rounded-lg custom-shadow p-6 md:p-8">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-cyan-700 mb-2">Travel Query Form</h1>
                <p class="text-gray-600">Help us plan your perfect vacation!</p>
            </div>

            <form id="travelForm" class="space-y-6">
                <div>
                    <label class="block text-gray-700 font-medium mb-2" for="name">Full Name</label>
                    <input type="text" id="name" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-cyan-500">
                </div>

                <div>
                    <label class="block text-gray-700 font-medium mb-2" for="email">Email Address</label>
                    <input type="email" id="email" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-cyan-500">
                </div>

                <div>
                    <label class="block text-gray-700 font-medium mb-2" for="destination">Preferred Destination</label>
                    <select id="destination" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-cyan-500">
                        <option value="">Select a destination</option>
                        <option value="europe">Europe</option>
                        <option value="asia">Asia</option>
                        <option value="americas">Americas</option>
                        <option value="africa">Africa</option>
                        <option value="oceania">Oceania</option>
                    </select>
                </div>

                <div>
                    <label class="block text-gray-700 font-medium mb-2">Travel Duration</label>
                    <div class="flex space-x-4">
                        <input type="number" id="duration" min="1" required class="w-24 px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-cyan-500">
                        <select id="durationType" class="px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-cyan-500">
                            <option value="days">Days</option>
                            <option value="weeks">Weeks</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-gray-700 font-medium mb-2">Budget Range (USD)</label>
                    <div class="flex items-center space-x-4">
                        <input type="range" id="budget" min="500" max="10000" step="500" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                        <span id="budgetValue" class="text-gray-700 font-medium">$5000</span>
                    </div>
                </div>

                <div>
                    <label class="block text-gray-700 font-medium mb-2">Travel Preferences</label>
                    <div class="space-y-2">
                        <label class="flex items-center">
                            <input type="checkbox" class="form-checkbox text-cyan-600" name="preferences" value="adventure">
                            <span class="ml-2">Adventure Activities</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" class="form-checkbox text-cyan-600" name="preferences" value="culture">
                            <span class="ml-2">Cultural Experiences</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" class="form-checkbox text-cyan-600" name="preferences" value="relaxation">
                            <span class="ml-2">Relaxation & Wellness</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" class="form-checkbox text-cyan-600" name="preferences" value="food">
                            <span class="ml-2">Food & Culinary</span>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-gray-700 font-medium mb-2" for="message">Additional Requirements</label>
                    <textarea id="message" rows="4" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-cyan-500"></textarea>
                </div>

                <div class="flex justify-center">
                    <button type="submit" class="bg-cyan-600 text-white px-8 py-3 rounded-md hover:bg-cyan-700 transition duration-300 flex items-center">
                        <i class="bi bi-send mr-2"></i>
                        Submit Query
                    </button>
                </div>
            </form>

            <!-- Success Message Modal (Hidden by default) -->
            <div id="successModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
                <div class="bg-white p-8 rounded-lg max-w-md text-center">
                    <i class="bi bi-check-circle text-5xl text-green-500 mb-4"></i>
                    <h3 class="text-xl font-bold mb-2">Query Submitted Successfully!</h3>
                    <p class="text-gray-600 mb-4">We'll get back to you within 24 hours.</p>
                    <button onclick="closeModal()" class="bg-cyan-600 text-white px-6 py-2 rounded-md hover:bg-cyan-700 transition duration-300">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Budget range slider
        const budgetSlider = document.getElementById('budget');
        const budgetValue = document.getElementById('budgetValue');
        
        budgetSlider.addEventListener('input', (e) => {
            budgetValue.textContent = `$${e.target.value}`;
        });

        // Form submission
        const form = document.getElementById('travelForm');
        const successModal = document.getElementById('successModal');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Here you would typically send the form data to a server
            // For demonstration, we'll just show the success modal
            successModal.classList.remove('hidden');
        });

        function closeModal() {
            successModal.classList.add('hidden');
            form.reset();
        }

        // Close modal when clicking outside
        successModal.addEventListener('click', (e) => {
            if (e.target === successModal) {
                closeModal();
            }
        });
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
